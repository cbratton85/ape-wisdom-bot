name: Pairs Finder

on:
  workflow_dispatch:
  schedule:
    # Weekly Sunday evening window (UTC). 23:00 UTC is Sunday evening in ET during DST.
    - cron: "0 23 * * 0"

jobs:
  run-pairs-finder:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy tqdm yfinance

      - name: Check Sunday evening window (ET)
        id: sunday_window
        run: |
          python - <<'PY'
          from datetime import datetime, time
          from zoneinfo import ZoneInfo
          import os

          now = datetime.now(ZoneInfo("America/New_York"))
          is_sunday = now.weekday() == 6
          is_evening = time(18, 0) <= now.time() <= time(23, 59, 59)
          should_run = is_sunday and is_evening

          print(f"Now (ET): {now.isoformat()}")
          print(f"Sunday: {is_sunday}")
          print(f"Evening window: {is_evening}")
          print(f"Should run: {should_run}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"run_now={'true' if should_run else 'false'}\n")
          PY

      - name: Run pairs finder
        if: steps.sunday_window.outputs.run_now == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python - <<'PY'
          import hashlib
          import pathlib
          import shutil
          import subprocess
          import sys

          repo_root = pathlib.Path.cwd()
          index_path = repo_root / "public/index.html"
          backup_path = repo_root / "public/index.html.workflow.bak"

          # Support either root-level or nested project layouts on GitHub Actions checkout.
          candidates = [
            repo_root / "pairs_finder.py",
            repo_root / "pairs_scanner" / "pairs_finder.py",
          ]
          script_path = next((p for p in candidates if p.exists()), None)
          if script_path is None:
            found = sorted(str(p) for p in repo_root.rglob("pairs_finder.py"))
            if len(found) == 1:
              script_path = pathlib.Path(found[0])
            else:
              print("Could not find a unique pairs_finder.py in repository.")
              print(f"Found candidates: {found}")
              raise SystemExit(1)

          print(f"Using finder script: {script_path}")

          def sha256(p: pathlib.Path):
            if not p.exists():
              return None
            h = hashlib.sha256()
            with p.open("rb") as f:
              while True:
                chunk = f.read(65536)
                if not chunk:
                  break
                h.update(chunk)
            return h.hexdigest()

          before = sha256(index_path)
          if index_path.exists():
            backup_path.parent.mkdir(parents=True, exist_ok=True)
            shutil.copy2(index_path, backup_path)

          try:
            subprocess.run([sys.executable, str(script_path)], check=True, cwd=str(script_path.parent))
          finally:
            after = sha256(index_path)
            if before != after and backup_path.exists():
              shutil.copy2(backup_path, index_path)
              print("Restored public/index.html to prevent overwrite.")
            if backup_path.exists():
              backup_path.unlink()
          PY

      - name: Skip notice
        if: steps.sunday_window.outputs.run_now != 'true' && github.event_name != 'workflow_dispatch'
        run: echo "Outside Sunday evening ET window; skipped."
