name: Total Market Scanner

on:
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # (No logo cache needed here since we only pull text data)

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Total Market Scan
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }} 
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python market_screener.py

      # --- COMMIT EVERYTHING ---
      - name: Commit and Push Meta Cache & HTML
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage the metadata cache (saves Sector/Industry so it doesn't re-download daily)
          git add meta_cache.json
          git add public/market_hotlist.html
          
          # Commit only if there are changes
          git commit -m "Update Total Market Hotlist [skip ci]" || exit 0
          
          # Rebase in case Ape Wisdom pushed something exactly while this was running
          git pull --rebase origin main
          git push origin main

      # --- DEPLOY TO PAGES ---
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true
          force_orphan: true
