name: Market Hours Runner

on:
  workflow_dispatch:
  schedule:
    # Every hour on weekdays (UTC). A random delay below spreads it within the hour.
    - cron: "0 * * * 1-5"
    # Close-run safety trigger at 16:10 ET (both DST variants).
    - cron: "10 20 * * 1-5" # EDT (UTC-4)
    - cron: "10 21 * * 1-5" # EST (UTC-5)

permissions:
  contents: write

concurrency:
  group: market-hours-runner
  cancel-in-progress: false   # queue the new run; don't abort the one already writing data

jobs:
  run-market-task:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install yfinance pandas numpy tqdm lxml; fi

      - name: Check US market-hours window (ET)
        id: market_window
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          from datetime import datetime, time
          from zoneinfo import ZoneInfo
          import os

          now = datetime.now(ZoneInfo("America/New_York"))
          is_weekday = now.weekday() < 5
          is_market_hours = time(9, 30) <= now.time() <= time(16, 0)
          is_eod_close_window = time(16, 5) <= now.time() <= time(16, 25)

          event_name = os.getenv("EVENT_NAME", "")
          event_schedule = os.getenv("EVENT_SCHEDULE", "")
          is_close_trigger = (
              event_name == "schedule"
              and event_schedule in {"10 20 * * 1-5", "10 21 * * 1-5"}
          )

          should_run = (is_weekday and (is_market_hours or is_eod_close_window)) or is_close_trigger

          print(f"Now (ET): {now.isoformat()}")
          print(f"Weekday: {is_weekday}")
          print(f"In market hours: {is_market_hours}")
          print(f"In EOD close window: {is_eod_close_window}")
          print(f"Close trigger schedule: {event_schedule}")
          print(f"Is close trigger: {is_close_trigger}")
          print(f"Should run: {should_run}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"run_now={'true' if should_run else 'false'}\n")
          PY

      - name: Run market data maintainer
        if: steps.market_window.outputs.run_now == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import sys

          repo_root = pathlib.Path.cwd()
          candidates = [
              repo_root / "market_data_maintainer.py",
              repo_root / "pairs_scanner" / "market_data_maintainer.py",
          ]
          script = next((p for p in candidates if p.exists()), None)
          if script is None:
              found = sorted(repo_root.rglob("market_data_maintainer.py"))
              if len(found) == 1:
                  script = found[0]
              else:
                  print(f"Could not find unique market_data_maintainer.py. Found: {[str(p) for p in found]}")
                  raise SystemExit(1)

          print(f"Using maintainer script: {script}")
          subprocess.run([sys.executable, str(script)], check=True, cwd=str(script.parent))
          PY

      - name: Run pairs scanner and prepare html
        if: steps.market_window.outputs.run_now == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python - <<'PY'
          import gzip
          import pathlib
          import shutil
          import subprocess
          import sys

          repo_root = pathlib.Path.cwd()
          candidates = [
              repo_root / "pairs_scanner.py",
              repo_root / "pairs_scanner" / "pairs_scanner.py",
          ]
          script = next((p for p in candidates if p.exists()), None)
          if script is None:
              found = sorted(repo_root.rglob("pairs_scanner.py"))
              if len(found) == 1:
                  script = found[0]
              else:
                  print(f"Could not find unique pairs_scanner.py. Found: {[str(p) for p in found]}")
                  raise SystemExit(1)

          print(f"Using scanner script: {script}")
          workdir = script.parent
          subprocess.run([sys.executable, str(script)], check=True, cwd=str(workdir))

          html_path = workdir / "pairs_scanner.html"
          gz_path = workdir / "pairs_scanner.html.gz"

          if not html_path.exists() and gz_path.exists():
              with gzip.open(gz_path, "rb") as src, html_path.open("wb") as dst:
                  shutil.copyfileobj(src, dst)
              print(f"Decompressed {gz_path} -> {html_path}")

          if not html_path.exists():
              print("pairs_scanner.html not found after scanner run.")
              raise SystemExit(1)

          publish_html = repo_root / "pairs_scanner.html"
          if html_path.resolve() != publish_html.resolve():
              shutil.copy2(html_path, publish_html)

          if gz_path.exists():
              publish_gz = repo_root / "pairs_scanner.html.gz"
              if gz_path.resolve() != publish_gz.resolve():
                  shutil.copy2(gz_path, publish_gz)

          public_dir = repo_root / "public"
          if public_dir.exists():
              public_dir.mkdir(parents=True, exist_ok=True)
              shutil.copy2(html_path, public_dir / "pairs_scanner.html")
          PY

      - name: Commit and push scanner html
        if: steps.market_window.outputs.run_now == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          if git ls-files --error-unmatch public/index.html >/dev/null 2>&1; then
            git checkout -- public/index.html
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pairs_scanner.html
          git add pairs_scanner.html.gz 2>/dev/null || true
          git add public/pairs_scanner.html 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No scanner HTML changes to commit."
            exit 0
          fi
          git commit -m "chore: update pairs scanner html"
          branch="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3; do
            git pull --rebase origin "$branch";
            if git push origin HEAD:"$branch"; then
              exit 0
            fi
            echo "Push failed (attempt $i). Retrying..."
            sleep 2
          done
          echo "Failed to push after retries."
          exit 1

      - name: Prepare gh-pages payload (scanner)
        if: steps.market_window.outputs.run_now == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p .pages-publish
          cp pairs_scanner.html .pages-publish/pairs_scanner.html

      - name: Deploy scanner to gh-pages
        if: steps.market_window.outputs.run_now == 'true' || github.event_name == 'workflow_dispatch'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./.pages-publish
          keep_files: true
          commit_message: "chore: publish pairs_scanner.html"

      - name: Skip notice
        if: steps.market_window.outputs.run_now != 'true' && github.event_name != 'workflow_dispatch'
        run: echo "Outside US market hours; skipped."
