name: Pairs Scanner

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab
  schedule:
    # Runs at minute 30 past the hour, 12:00 to 21:00 UTC, Mon-Fri (Market Hours)
    - cron: '30 12-21 * * 1-5'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: main-publish-lock
  cancel-in-progress: false

jobs:
  run-scanner-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install yfinance pandas numpy tqdm lxml; fi

      - name: Cache Market Data
        uses: actions/cache@v4
        with:
          path: |
            stock_data.csv.gz
            etf_data.csv.gz
            chart_data.csv.gz
            active_trades.json
          key: market-data-${{ github.run_id }}
          restore-keys: |
            market-data-

      - name: Run Pairs Scanner
        env:
          PYTHONUNBUFFERED: "1"
        run: python pairs_scanner.py

      - name: Prepare Website Files
        run: |
          mkdir -p public
          # Prefer plain HTML for Pages route; derive from .gz when needed.
          if [ -f pairs_scanner.html ]; then
            mv pairs_scanner.html public/
          elif [ -f pairs_scanner.html.gz ]; then
            python - <<'PY'
            import gzip
            import shutil

            with gzip.open("pairs_scanner.html.gz", "rb") as src, open("public/pairs_scanner.html", "wb") as dst:
                shutil.copyfileobj(src, dst)
            PY
            mv pairs_scanner.html.gz public/ || true
          fi
          # Move active trades tracker (if generated)
          mv active_trades.html public/ || true
          # Move symbols list (if generated)
          mv symbols.html public/ || true
          # Copy data files so the site can load charts
          cp stock_data.csv.gz public/ || true
          cp etf_data.csv.gz public/ || true
          cp chart_data.csv.gz public/ || true

      - name: Protect public/index.html
        run: |
          if git ls-files --error-unmatch public/index.html >/dev/null 2>&1; then
            git checkout -- public/index.html
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
