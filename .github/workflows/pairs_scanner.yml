name: Market Pairs Scanner

on:
  workflow_dispatch:

# Give the action permission to write back to the repository
permissions:
  contents: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy tqdm

      - name: Cache Market Data
        uses: actions/cache@v3
        with:
          path: |
            historical_data.csv.gz
            chart_data.csv.gz
            volume_data.csv.gz
          key: market-data-${{ github.run_id }}
          restore-keys: |
            market-data-

      - name: Run Pairs Scanner
        run: python pairs_scanner.py

      # This new step saves the generated HTML and data files back to your repo
      - name: Commit and Push Dashboard to Repo
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add market_scanner.html symbols.html historical_data.csv.gz chart_data.csv.gz volume_data.csv.gz
          git commit -m "Automated update of market scanner dashboards" || echo "No changes to commit"
          git push
