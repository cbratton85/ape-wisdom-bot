name: Market Pairs Scanner

on:
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy tqdm

      - name: Cache Market Data
        uses: actions/cache@v3
        with:
          path: |
            historical_data.csv
            chart_data.csv
            volume_data.csv
          # Creates a new cache every run but restores from the most recent one
          key: market-data-${{ github.run_id }}
          restore-keys: |
            market-data-

      - name: Run Pairs Scanner
        run: python pairs_scanner.py

      - name: Upload Dashboards as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scanner-dashboards
          path: |
            market_scanner.html
            symbols.html
