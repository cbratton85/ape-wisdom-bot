name: Market Pairs Scanner

on:
  workflow_dispatch:
  # Note: If you want this to run automatically every day, 
  # you can paste the schedule back in here later!

# Grant the permissions needed to deploy directly to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  run-scanner-and-publish:
    runs-on: ubuntu-latest
    
    # Required environment for Pages deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy tqdm

      - name: Cache Market Data
        uses: actions/cache@v3
        with:
          path: |
            historical_data.csv.gz
            chart_data.csv.gz
            volume_data.csv.gz
          key: market-data-${{ github.run_id }}
          restore-keys: |
            market-data-

      - name: Run Pairs Scanner
        run: python pairs_scanner.py

      # --- NEW DEPLOYMENT STEPS ---

      - name: Prepare files for publishing
        run: |
          # Create a folder to hold everything we want on the website
          mkdir _site
          
          # Move your HTML files into the folder
          mv pairs_scanner.html _site/index.html  # Rename to index.html so it loads by default
          mv symbols.html _site/ || true          # || true prevents failure if the file is missing
          
          # Move data files if your HTML needs to read them dynamically
          mv *.csv.gz _site/ || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site/' # Uploads the folder we just created

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
