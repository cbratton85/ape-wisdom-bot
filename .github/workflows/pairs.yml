name: Pairs Scanner

on:
  workflow_dispatch: # Keeps the manual button!
  schedule:
    # Runs at exactly minute 30 past the hour, from 12:00 to 21:00 UTC, Mon-Fri.
    # This covers 8:30 AM to 4:30 PM Eastern Time year-round.
    - cron: '30 12-21 * * 1-5'

# Grant the bot permission to push to the gh-pages branch
permissions:
  contents: write

jobs:
  run-scanner-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy tqdm

      - name: Cache Market Data
        uses: actions/cache@v4
        with:
          path: |
            historical_data.csv.gz
            chart_data.csv.gz
            volume_data.csv.gz
            market_cap.json
            active_trades.json
          key: market-data-${{ github.run_id }}
          restore-keys: |
            market-data-

      - name: Run Pairs Scanner
        run: python pairs_scanner.py

      # Move all generated HTML files and compressed data to the public folder
      - name: Prepare Website Files
        run: |
          mkdir -p public
          mv pairs_scanner.html public/
          mv symbols.html public/ || true
          mv active_trades.html public/ || true
          cp *.csv.gz public/ || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
