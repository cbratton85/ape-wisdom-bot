name: Stock Dashboard Update

on:
  schedule:
    # Runs at minute 45, every hour from 13:00 to 20:00 UTC, Monday-Friday.
    # 13:45 UTC is 9:45 AM ET (Market Open)
    # 20:45 UTC is 4:45 PM ET (Post-Market Close)
    - cron: '45 13-20 * * 1-5'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy

      - name: Run Dashboard Script
        run: python stock_dashboard.py

      - name: Upload HTML Dashboard
        uses: actions/upload-artifact@v4
        with:
          name: stock-dashboard
          path: stock_dashboard.html
