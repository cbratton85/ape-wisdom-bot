name: Market Momentum Tracker

on:
  workflow_dispatch:        # Manual Trigger
  # schedule:               # Optional: Run every hour
  #   - cron: '0 * * * *'

permissions:
  contents: write           # Allows saving history and logos

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # --- STEP 1: RESTORE LOGO CACHE ---
      - name: Cache Logos
        uses: actions/cache@v4
        with:
          path: public/logos
          key: ${{ runner.os }}-logos-v1
          restore-keys: |
            ${{ runner.os }}-logos-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Market Scan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LOGO_DEV_TOKEN: ${{ secrets.LOGO_DEV_TOKEN }} 
        run: python ape_wisdom.py --auto

      # --- STEP 2: COMMIT EVERYTHING ---
      - name: Commit and Push History & Logos
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage logos, history files, and HTML
          git add public/logos/
          git add .
          
          git commit -m "Update Market Data & Cached Logos [skip ci]" || echo "No changes to commit"
          git push

      # --- STEP 3: DEPLOY TO PAGES ---
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true
          force_orphan: true  # <--- THIS FIXES THE "STOPPED UPDATING" ISSUE
