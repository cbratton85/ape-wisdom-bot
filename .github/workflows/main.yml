name: Market Momentum Tracker

on:
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # OPTIMIZATION 1: Native pip caching to speed up dependency installation
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # <--- This tells GitHub to cache your requirements.txt

      # OPTIMIZATION 2: Dynamic cache key to ensure new logos are always saved
      - name: Cache Logos
        uses: actions/cache@v4
        with:
          path: public/logos
          key: ${{ runner.os }}-logos-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-logos-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Market Scan
        env:
          LOGO_DEV_TOKEN: ${{ secrets.LOGO_DEV_TOKEN }} 
        run: python ape_wisdom.py --auto

      # OPTIMIZATION 3: Stop committing logos to prevent repo bloat
      - name: Commit and Push History Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage all changes
          git add .
          
          # UNSTAGE the logos folder so they don't get saved to your Git history
          git reset public/logos/
          
          # Commit only if there are data/history changes
          git commit -m "Update Market Data [skip ci]" || exit 0
          
          # Pull latest changes to avoid conflicts, then push
          git pull --rebase origin main
          git push origin main

      # The logos are still sitting in the runner's public/ folder, 
      # so this step will still successfully publish them to your website!
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true
          force_orphan: true
