name: Momentum Scanner

on:
  workflow_dispatch:
  #schedule:
    # Runs every 30 minutes
    # - cron: '*/30 * * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write 

concurrency:
  group: momentum-scanner
  cancel-in-progress: false   # queue the new run; don't abort the one already writing data

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # OPTIMIZATION 1: Native pip caching to speed up dependency installation
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # <--- This tells GitHub to cache your requirements.txt

      # OPTIMIZATION 2: Dynamic cache key to ensure new logos are always saved
      - name: Cache Logos
        uses: actions/cache@v4
        with:
          path: public/logos
          key: ${{ runner.os }}-logos-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-logos-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install yfinance pandas numpy tqdm lxml; fi

      - name: Run Market Scan
        env:
          LOGO_DEV_TOKEN: ${{ secrets.LOGO_DEV_TOKEN }} 
        run: python ape_wisdom.py --auto

      - name: Protect public/index.html
        run: |
          if git ls-files --error-unmatch public/index.html >/dev/null 2>&1; then
            git checkout -- public/index.html
          fi

      # OPTIMIZATION 3: Stop committing logos to prevent repo bloat
      - name: Commit and Push History Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage all changes
          git add .
          
          # UNSTAGE the logos folder so they don't get saved to your Git history
          git reset public/logos/
          
          # Commit only if there are data/history changes
          git commit -m "Update Market Data [skip ci]" || exit 0
          
          # Pull latest changes to avoid conflicts, then push with retries.
          branch="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3; do
            git pull --rebase origin "$branch"
            if git push origin HEAD:"$branch"; then
              exit 0
            fi
            echo "Push failed (attempt $i). Retrying..."
            sleep 2
          done
          echo "Failed to push after retries."
          exit 1

      # The logos are still sitting in the runner's public/ folder, 
      # so this step will still successfully publish them to your website!
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
