name: Stock Dashboard

on:
  schedule:
    # Runs at 45 minutes past the hour during US Market hours (UTC)
    - cron: '45 13-20 * * 1-5'
  workflow_dispatch:

# OPT-IN TO NODE 24: This clears the deprecation warning for all actions
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy

      - name: Run Dashboard Script
        run: python stock_dashboard.py

      - name: Prepare Public Folder
        run: |
          mkdir -p public
          mv stock_dashboard.html public/stock_dashboard.html
          cp -r *.csv public/ 2>/dev/null || true

      - name: Commit and Push Data Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if [ -d "public/logos" ]; then
            git reset public/logos/
          fi
          git commit -m "Update Dashboard Data [skip ci]" || echo "No changes"
          git pull --rebase origin main
          git push origin main

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true
