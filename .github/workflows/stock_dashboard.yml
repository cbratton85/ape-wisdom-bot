name: Stock Dashboard

on:
  workflow_dispatch:
  schedule:
    # Runs at 45 minutes past the hour during US Market hours (UTC)
    # - cron: '15 13-20 * * 1-5'
  
concurrency:
  group: stock-dashboard
  cancel-in-progress: false   # queue the new run; don't abort the one already writing data
  
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install yfinance pandas numpy tqdm lxml; fi

      - name: Run Dashboard Script
        run: python stock_dashboard.py

      - name: Prepare Public Folder
        run: |
          mkdir -p public
          mv stock_dashboard.html public/stock_dashboard.html
          cp -r *.csv public/ 2>/dev/null || true

      - name: Protect public/index.html
        run: |
          if git ls-files --error-unmatch public/index.html >/dev/null 2>&1; then
            git checkout -- public/index.html
          fi

      - name: Commit and Push Data Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if [ -d "public/logos" ]; then
            git reset public/logos/
          fi
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update Dashboard Data [skip ci]"
          branch="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3; do
            git pull --rebase origin "$branch"
            if git push origin HEAD:"$branch"; then
              exit 0
            fi
            echo "Push failed (attempt $i). Retrying..."
            sleep 2
          done
          echo "Failed to push after retries."
          exit 1

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true
