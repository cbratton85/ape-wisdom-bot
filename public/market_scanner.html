<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Scanner - Coming Soon</title>
    <style>
        * { 
            box-sizing: border-box; 
        }
        body {
            background-color: #101010;
            color: #e0e0e0;
            font-family: 'Consolas', 'Monaco', monospace;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 50px 80px;
            border: 1px solid #333;
            border-radius: 12px;
            background: #18181b;
            box-shadow: 0 15px 50px rgba(0,0,0,0.9);
        }
        h1 {
            font-size: 3.5rem;
            margin: 0 0 10px 0;
            /* Same blue gradient as your new SCAN button */
            background: linear-gradient(135deg, #0044ff, #00aaff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 170, 255, 0.2);
            letter-spacing: -2px;
        }
        p {
            font-size: 1.5rem;
            color: #888;
            margin-bottom: 40px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        /* Cool blinking dot animation */
        .dot { animation: blink 1.5s infinite; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes blink {
            0% { opacity: 0.2; }
            50% { opacity: 1; }
            100% { opacity: 0.2; }
        }
        
        .btn-back {
            display: inline-block;
            padding: 10px 24px;
            background: #1a1a1a;
            color: #00ff00;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            border: 1px solid #00ff00;
            border-radius: 6px;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }
        .btn-back:hover {
            background: #00ff00;
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>MARKET SCANNER</h1>
        <p>Coming Soon<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></p>
        
        <a href="index.html" class="btn-back">← Return to Dashboard</a>
    </div>

</body>
</html>
